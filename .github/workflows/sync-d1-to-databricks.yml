name: Sync D1 to Databricks Lakehouse

on:
  schedule:
    # Daily at 02:00 UTC (after store close and daily audit submissions)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-tabular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run D1 to Databricks Tabular Sync
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_SQL_WAREHOUSE_ID: ${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID || '959d56e804ae9b36' }}
        run: python3 scripts/sync_d1_to_databricks_tabular.py
